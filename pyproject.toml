[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe"
version = "0.1.0"
description = "RSNA STR Pulmonary Embolism Detection: slice CNNs and series-level sequence models for CT pulmonary angiography"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
